baseURL = 'https://donutquine.blog/'
locale = 'ru-ru'
title = 'donutquine’s blog'
theme = 'papermod'

defaultContentLanguage = "ru"

disableHugoGeneratorInject = true

[params]
hideFooter = true
disableScrollToTop = true
showFullTextinRSS = true
showRssButtonInSectionTermList = true
enableRobotsTXT = true

# If mainSections is not defined in your project configuration, this method returns a slice with one element—the top-level section with the most pages.
# https://gohugo.io/methods/site/mainsections/
mainSections = ["posts", "articles", "bus39"]

[services]
  [services.googleAnalytics]
    id = "G-NK7HS0Y4J2"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
